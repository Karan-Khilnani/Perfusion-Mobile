openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /profile/callback-device:
    get:
      operationId: getCallbackDevice
      tags: [profile]
      summary: Get the signed-in user's callback device
      responses:
        "200":
          description: Device or null when setup is needed
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/CallbackDevice"
                  - type: "null"
        "401": { description: Not authenticated }
    put:
      operationId: saveCallbackDevice
      tags: [profile]
      summary: Create or update the signed-in user's callback device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallbackDeviceInput"
      responses:
        "200":
          description: Saved callback device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallbackDevice"
        "400": { description: Invalid device name or phone number }
        "401": { description: Not authenticated }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Send an account-recovery code
      description: Sends a short-lived six-digit code to the registered account email. This endpoint intentionally distinguishes an unregistered email so the mobile app can offer signup.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "200":
          description: Recovery code sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400": { description: Invalid email address }
        "404": { description: This email is not registered }
        "429": { description: Too many recovery requests }
        "500": { description: Could not send the recovery code }
  /auth/password-reset/verify:
    post:
      operationId: verifyPasswordResetCode
      tags: [auth]
      summary: Verify an account-recovery code and establish a session
      description: Consumes the short-lived code and creates the normal persistent session only after successful verification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetVerification"
      responses:
        "200":
          description: Verified account and authenticated session user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetSessionUser"
        "400": { description: Invalid or expired recovery code }
        "401": { description: Account is deactivated }
        "429": { description: Too many code attempts }
  /auth/password-reset/change:
    post:
      operationId: changePasswordAfterRecovery
      tags: [auth]
      summary: Set a password in a verified recovery session
      description: Available only during the short-lived session established by successful recovery-code verification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetPassword"
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400": { description: Invalid password }
        "401": { description: Recovery session is not valid }
  /auth/password-reset/continue:
    post:
      operationId: finishPasswordReset
      tags: [auth]
      summary: Finish recovery without changing the password
      description: Clears the temporary password-change permission while keeping the authenticated session.
      responses:
        "200":
          description: Recovery flow finished
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401": { description: Recovery session is not valid }
  /provider/my-consultants:
    get:
      operationId: getMyConsultants
      tags: [consultants]
      summary: List consultants owned by the signed-in provider
      responses:
        "200":
          description: The provider's consultant profiles and shared availability state
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConsultantAvailability" }
        "401": { description: Not authenticated }
        "403": { description: Provider profile required }
  /provider/consultants/{id}/media:
    post:
      operationId: uploadProviderConsultantMedia
      tags: [consultants]
      summary: Upload an owned consultant photo, signature, private registration document or portfolio photo
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [kind, file]
              properties:
                kind: { type: string, enum: [photo, signature, registration_document, portfolio_photo] }
                file: { type: string, format: binary }
      responses:
        "201": { description: New profile media record }
        "200": { description: Updated consultant photo or signature }
        "403": { description: Not the owning consultant }
        "503": { description: Persistent file storage unavailable }
  /provider/consultants/{id}/media/{mediaId}:
    delete:
      operationId: deleteProviderPortfolioPhoto
      tags: [consultants]
      summary: Delete an owned portfolio photo
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: mediaId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Deleted }
        "403": { description: Not the owning consultant }
        "404": { description: Photo not found }
  /provider/consultants/{id}/media/{mediaId}/signed-url:
    get:
      operationId: getProviderRegistrationDocumentSignedUrl
      tags: [consultants]
      summary: Get a short-lived private registration document link
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: mediaId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Authorized document link
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string, format: uri }
        "403": { description: Not the owning consultant }
        "404": { description: Document not found }
  /provider/consultants/{id}:
    patch:
      operationId: updateProviderConsultant
      tags: [consultants]
      summary: Update the signed-in provider's consultant profile or availability
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsultantAvailabilityUpdate" }
      responses:
        "200":
          description: Updated consultant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsultantAvailability" }
        "400": { description: Invalid availability status }
        "401": { description: Not authenticated }
        "403": { description: Provider role or ownership check failed }
        "404": { description: Consultant not found }
  /consultants:
    get:
      operationId: listConsultants
      tags: [consultants]
      summary: List approved consultants and their next eligible availability
      responses:
        "200":
          description: Public consultant list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConsultantAvailability" }
  /consultants/{id}/bookable-slots:
    get:
      operationId: getConsultantBookableSlots
      tags: [consultants]
      summary: Server-computed 30-minute bookable slots across up to 30 days in IST
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: start
          in: query
          required: true
          schema: { type: string, format: date }
        - name: end
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Dates with at least one available slot
          content:
            application/json:
              schema:
                type: object
                required: [dates]
                properties:
                  dates:
                    type: array
                    items:
                      type: object
                      required: [date, slots]
                      properties:
                        date: { type: string, format: date }
                        slots:
                          type: array
                          items: { $ref: "#/components/schemas/BookableSlot" }
        "400": { description: Invalid date range }
        "404": { description: Consultant not found }
  /consultants/{id}:
    get:
      operationId: getConsultant
      tags: [consultants]
      summary: Get a consultant, including current availability
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Consultant profile and next eligible availability
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsultantAvailability" }
        "404": { description: Consultant not found }
  /bookings/{id}:
    get:
      operationId: getBookingById
      tags: [calls]
      summary: Get an authorized booking
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Booking details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingCallInfo"
        "403":
          description: Access denied
        "404":
          description: Booking not found
  /bookings/{id}/status:
    patch:
      operationId: updateBookingStatus
      tags: [bookings]
      summary: Update a booking status; consultations only allow pause or resume
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [booked, ongoing, paused, sample_collected, processing, report_ready, completed, cancelled, in_transit, arrived]
      responses:
        "200":
          description: Updated booking status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingCallInfo"
        "400": { description: Invalid consultation status }
        "403": { description: Only the assigned Provider may pause or resume }
        "409": { description: Consultation is not within its active window }
  /call/status/{bookingId}:
    get:
      operationId: getCallStatus
      tags: [calls]
      summary: Get the current call-session status
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current call status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallStatus"
        "403":
          description: Access denied
        "404":
          description: Booking not found
  /call/stream-credentials/{bookingId}:
    get:
      operationId: getStreamCallCredentials
      tags: [calls]
      summary: Get short-lived Stream Video credentials for an accepted call
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stream Video call credentials for the authenticated call participant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamCallCredentials"
        "401": { description: Not authenticated }
        "403": { description: Access denied }
        "404": { description: Booking not found }
        "409": { description: No accepted Stream call session }
        "503": { description: Stream Video is not configured }
  /bookings/{bookingId}/case-file:
    get:
      operationId: getCaseFile
      tags: [case-file]
      summary: Get the authorized Case File aggregate
      parameters:
        - $ref: "#/components/parameters/BookingId"
      responses:
        "200":
          description: Case File aggregate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseFileAggregate"
        "403": { description: Access denied }
        "404": { description: Booking not found }
  /bookings/{bookingId}/case-file/messages:
    get:
      operationId: getCaseFileMessages
      tags: [case-file]
      summary: List Case File messages
      parameters:
        - $ref: "#/components/parameters/BookingId"
        - name: cursor
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseFileMessagesResponse"
    post:
      operationId: createCaseFileMessage
      tags: [case-file]
      summary: Send a Case File text message
      parameters:
        - $ref: "#/components/parameters/BookingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseFileMessageInput"
      responses:
        "201":
          description: Created message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseFileMessage"
        "403": { description: Access denied or closed Case File }
  /bookings/{bookingId}/case-file/vitals:
    get:
      operationId: getCaseFileVitals
      tags: [case-file]
      summary: List Case File vitals
      parameters:
        - $ref: "#/components/parameters/BookingId"
      responses:
        "200":
          description: Vitals flowsheet
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CaseFileVital" }
    post:
      operationId: createCaseFileVital
      tags: [case-file]
      summary: Add a Seeker-recorded vital
      parameters:
        - $ref: "#/components/parameters/BookingId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaseFileVitalInput" }
      responses:
        "201":
          description: Created vital
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseFileVital" }
        "403": { description: Only the Seeker may add vitals }
  /bookings/{bookingId}/case-file/advisories:
    get:
      operationId: getCaseFileAdvisories
      tags: [case-file]
      summary: List the Clinical Advisory trail
      parameters:
        - $ref: "#/components/parameters/BookingId"
      responses:
        "200":
          description: Advisory trail
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CaseFileAdvisory" }
    post:
      operationId: createCaseFileAdvisory
      tags: [case-file]
      summary: Add a Provider Clinical Advisory
      parameters:
        - $ref: "#/components/parameters/BookingId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaseFileAdvisoryInput" }
      responses:
        "201":
          description: Created Advisory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseFileAdvisory" }
        "403": { description: Only the assigned Provider may add Advisories }
  /bookings/{bookingId}/case-file/attachments:
    post:
      operationId: createCaseFileAttachment
      tags: [case-file]
      summary: Finalize a Case File attachment
      parameters:
        - $ref: "#/components/parameters/BookingId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/CaseFileAttachmentInput" }
      responses:
        "201":
          description: Created attachment message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseFileMessage" }
        "200":
          description: Existing attachment returned for an idempotent retry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseFileMessage" }
        "403": { description: Access denied or closed Case File }
  /bookings/{bookingId}/case-file/follow-up-access:
    patch:
      operationId: updateCaseFileFollowUpAccess
      tags: [case-file]
      summary: Toggle Seeker follow-up call/video access
      parameters:
        - $ref: "#/components/parameters/BookingId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaseFileFollowUpAccessInput" }
      responses:
        "200":
          description: Updated access
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseFileCapabilities" }
        "403": { description: Only the assigned Provider may update access }
  /bookings/{bookingId}/case-file/attachments/{attachmentId}/download:
    get:
      operationId: downloadCaseFileAttachment
      tags: [case-file]
      summary: Download an authorized Case File attachment
      parameters:
        - $ref: "#/components/parameters/BookingId"
        - name: attachmentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Attachment bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        "302": { description: Legacy attachment redirect }
        "403": { description: Access denied }
        "404": { description: Attachment not found }
  /bookings/{bookingId}/case-file/attachments/{attachmentId}/signed-url:
    get:
      operationId: getCaseFileAttachmentSignedUrl
      tags: [case-file]
      summary: Get a short-lived authorized URL for a private Case File attachment
      parameters:
        - $ref: "#/components/parameters/BookingId"
        - name: attachmentId
          in: path
          required: true
          schema: { type: string }
        - name: disposition
          in: query
          required: false
          description: Whether the short-lived link opens inline or downloads as an attachment
          schema: { type: string, enum: [inline, attachment], default: attachment }
      responses:
        "200":
          description: Short-lived download URL
          content:
            application/json:
              schema:
                type: object
                required: [url, expiresIn]
                properties:
                  url: { type: string, format: uri }
                  expiresIn: { type: integer, description: Seconds until the URL expires }
        "403": { description: Access denied }
        "404": { description: Attachment not found }
  /verify/case-file-advisory/{advisoryId}:
    get:
      operationId: verifyCaseFileAdvisory
      tags: [case-file]
      summary: Verify that an immutable Clinical Advisory exists
      parameters:
        - name: advisoryId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Verified Clinical Advisory metadata
          content:
            application/json:
              schema:
                type: object
                required: [document, advisoryId, authoredAt, isVerified]
                properties:
                  document: { type: string, const: Clinical Advisory }
                  advisoryId: { type: string }
                  authorName: { type: ["string", "null"] }
                  authoredAt: { type: string, format: date-time }
                  isVerified: { type: boolean, const: true }
        "404": { description: Clinical Advisory not found }
components:
  parameters:
    BookingId:
      name: bookingId
      in: path
      required: true
      schema: { type: string }
  schemas:
    CallbackDevice:
      type: object
      required: [deviceName, phoneNumber, updatedAt]
      properties:
        deviceName: { type: string }
        phoneNumber: { type: string }
        updatedAt: { type: string, format: date-time }
    CallbackDeviceInput:
      type: object
      required: [deviceName, phoneNumber]
      properties:
        deviceName: { type: string, minLength: 1, maxLength: 100 }
        phoneNumber: { type: string, minLength: 7, maxLength: 25 }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 320 }
    PasswordResetVerification:
      type: object
      required: [email, code]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        code: { type: string, pattern: "^[0-9]{6}$" }
    PasswordResetPassword:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 6, maxLength: 128 }
    MessageResponse:
      type: object
      required: [message]
      properties:
        message: { type: string }
    PasswordResetSessionUser:
      type: object
      description: Authenticated user returned after recovery-code verification. Additional safe account fields are included for compatibility with existing mobile sign-in.
      required: [id, email, role]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        firstName: { type: ["string", "null"] }
        lastName: { type: ["string", "null"] }
        role: { type: string }
        approvalStatus: { type: ["string", "null"] }
        requiresAgreement: { type: boolean }
        needsProfile: { type: boolean }
      additionalProperties: true
    BookingCallInfo:
      type: object
      properties:
        id:
          type: string
        serviceName:
          type: ["string", "null"]
        patientName:
          type: ["string", "null"]
        videoRoomId:
          type: ["string", "null"]
        status:
          type: string
      required:
        - id
        - status
    CallStatus:
      type: object
      properties:
        status:
          type: string
        videoRoomUrl:
          type: ["string", "null"]
        mediaProvider:
          type: string
          enum: [daily, stream]
        isCaller:
          type: boolean
      required:
        - status
        - mediaProvider
    StreamCallCredentials:
      type: object
      required: [apiKey, token, callId, callType, userId, userName, sessionGeneration, mediaProvider]
      properties:
        apiKey: { type: string }
        token: { type: string }
        callId: { type: string }
        callType: { type: string, enum: [default] }
        userId: { type: string }
        userName: { type: string }
        sessionGeneration: { type: string }
        mediaProvider: { type: string, enum: [stream] }
    CaseFileCapabilities:
      type: object
      required: [canMessage, canAttach, canAddVitals, canComposeAdvisory, canToggleFollowUp, readOnly, callsEnabled, videoEnabled]
      properties:
        canMessage: { type: boolean }
        canAttach: { type: boolean }
        canAddVitals: { type: boolean }
        canComposeAdvisory: { type: boolean }
        canToggleFollowUp: { type: boolean }
        readOnly: { type: boolean }
        callsEnabled: { type: boolean }
        videoEnabled: { type: boolean }
    CaseFileAttachment:
      type: object
      required: [id, bookingId, category, source, createdAt]
      properties:
        id: { type: string }
        bookingId: { type: string }
        messageId: { type: ["string", "null"] }
        uploaderUserId: { type: string }
        uploaderRole: { type: string }
        originalFilename: { type: ["string", "null"] }
        mimeType: { type: ["string", "null"] }
        byteSize: { type: ["integer", "null"] }
        durationSeconds: { type: ["number", "null"] }
        objectPath: { type: ["string", "null"] }
        legacyUrl: { type: ["string", "null"] }
        source: { type: string }
        category: { type: string }
        createdAt: { type: string, format: date-time }
    CaseFileMessage:
      type: object
      required: [id, bookingId, senderUserId, senderRole, kind, createdAt]
      properties:
        id: { type: string }
        bookingId: { type: string }
        senderUserId: { type: string }
        senderRole: { type: string }
        kind: { type: string }
        body: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        attachment: { oneOf: [{ $ref: "#/components/schemas/CaseFileAttachment" }, { type: "null" }] }
    CaseFileMessageInput:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 10000 }
    CaseFileMessagesResponse:
      type: object
      required: [messages, nextCursor]
      properties:
        messages:
          type: array
          items: { $ref: "#/components/schemas/CaseFileMessage" }
        nextCursor: { type: ["string", "null"] }
    CaseFileVital:
      type: object
      required: [id, bookingId, recordedByUserId, observedAt, createdAt]
      properties:
        id: { type: string }
        bookingId: { type: string }
        recordedByUserId: { type: string }
        observedAt: { type: string, format: date-time }
        systolicBp: { type: ["integer", "null"] }
        diastolicBp: { type: ["integer", "null"] }
        heartRate: { type: ["integer", "null"] }
        respiratoryRate: { type: ["integer", "null"] }
        intake: { type: ["number", "null"] }
        output: { type: ["number", "null"] }
        hourlyUrineOutput: { type: ["number", "null"] }
        gcs: { type: ["integer", "null"] }
        createdAt: { type: string, format: date-time }
    CaseFileVitalInput:
      type: object
      required: [observedAt]
      properties:
        observedAt: { type: string, format: date-time }
        systolicBp: { type: ["integer", "null"] }
        diastolicBp: { type: ["integer", "null"] }
        heartRate: { type: ["integer", "null"] }
        respiratoryRate: { type: ["integer", "null"] }
        intake: { type: ["number", "null"] }
        output: { type: ["number", "null"] }
