openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /bookings/{id}:
    get:
      operationId: getBookingById
      tags: [calls]
      summary: Get an authorized booking
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Booking details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingCallInfo"
        "403":
          description: Access denied
        "404":
          description: Booking not found
  /call/status/{bookingId}:
    get:
      operationId: getCallStatus
      tags: [calls]
      summary: Get the current call-session status
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current call status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallStatus"
        "403":
          description: Access denied
        "404":
          description: Booking not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    BookingCallInfo:
      type: object
      properties:
        id:
          type: string
        serviceName:
          type: ["string", "null"]
        patientName:
          type: ["string", "null"]
        videoRoomId:
          type: ["string", "null"]
        status:
          type: string
      required:
        - id
        - status
    CallStatus:
      type: object
      properties:
        status:
          type: string
        videoRoomUrl:
          type: ["string", "null"]
        isCaller:
          type: boolean
      required:
        - status

